[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumoxic-sdk"
version = "0.1.0"
description = "Python SDK for the Lumoxic AI photon computing and binary bounce simulation API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Lumoxic AI", email = "sdk@lumoxic.ai"},
]
keywords = ["lumoxic", "photon", "energy", "computing", "simulation", "sdk", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://lumoxic.ai"
Documentation = "https://docs.lumoxic.ai/sdk/python"
Repository = "https://github.com/franceshosker/lumoxic-sdk"
Issues = "https://github.com/franceshosker/lumoxic-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["lumoxic_sdk"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
